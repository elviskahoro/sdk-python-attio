name: Publish to PyPI

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Kept for GitHub environment protection rules (required reviewers,
    # deployment branch policy), not for OIDC -- this job has no id-token
    # permission, so it's purely a deploy-target gate, not a trusted-
    # publishing scope.
    environment:
      name: pypi
    env:
      DAGGER_PROGRESS: plain
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1

      - name: Verify tag matches package versions
        if: github.ref_type == 'tag'
        run: uv run python ci/pipeline.py verify-version "${GITHUB_REF_NAME#v}"

      - name: Run tests
        run: uv run python ci/pipeline.py test

      - name: Build distribution
        run: uv run python ci/pipeline.py build

      - name: Check PYPI_TOKEN is set
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${PYPI_TOKEN}" ]; then
            echo "::error::PYPI_TOKEN secret is empty or unset. Re-set it at https://github.com/${{ github.repository }}/settings/secrets/actions before retrying." >&2
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          # PEP 740 attestations only work via OIDC trusted publishing, which
          # this workflow doesn't use (see comment on `environment:` above).
          # TODO: fix the trusted-publisher config on pypi.org (still points
          # at the pre-rename repo name) and switch back to OIDC + attestations.
          attestations: false
