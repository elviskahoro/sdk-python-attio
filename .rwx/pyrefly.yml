# On-demand pyrefly with a synced venv. Manual only: no github trigger, so it
# never runs on PRs or pushes and is not a required status.
#   rwx run .rwx/pyrefly.yml --wait
#   rwx run .rwx/pyrefly.yml --wait --init paths="attio_cli/main.py"   # default: attio_cli ci, matching Trunk scope
# `rwx run` layers the local working tree on the clone; HEAD must be pushed
# so `commit-sha` resolves.
on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      paths: "attio_cli ci"

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/elviskahoro/sdk-python-attio.git
      ref: ${{ init.commit-sha }}

  - key: python
    call: python/install 2.0.1
    with:
      python-version: "3.13"

  - key: uv
    use: python
    run: pip install uv==0.11.26

  # The project installs editable from generated/src, so sources must be in
  # the workspace or `import attio` fails on a fresh sync.
  - key: sync
    use: [code, uv]
    run: uv sync
    filter:
      - pyproject.toml
      - uv.lock
      - README.md
      - generated/src
      - attio_cli

  # pyrefly is pinned to the Trunk version (.trunk/trunk.yaml); not in the dev group.
  - key: pyrefly
    use: [code, sync]
    cache: false
    env:
      CHECK_PATHS: ${{ init.paths }}
    run: |
      set -euo pipefail
      uv run --with pyrefly==1.3.1 pyrefly check --python-interpreter-path .venv/bin/python --search-path . --site-package-path generated/src ${CHECK_PATHS}
