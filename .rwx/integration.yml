# Live-API integration check against Attio (needs ATTIO_API_TOKEN in the
# sdk-python-attio vault).
# Not path-filtered: a path-filtered required check does not report on
# every PR and would deadlock the Trunk Merge Queue. PR and queue/main pushes
# share one status-check name so a single check covers both.
on:
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
      status-checks:
        name: integration
    push:
      - if: ${{ event.git.branch == 'main' }}
        init:
          commit-sha: ${{ event.git.sha }}
        status-checks:
          name: integration
      - if: ${{ starts-with(event.git.branch, 'trunk-merge/') || starts-with(event.git.branch, 'trunk-merge-beta/') }}
        init:
          commit-sha: ${{ event.git.sha }}
        status-checks:
          name: integration
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/elviskahoro/sdk-python-attio.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true

  - key: python
    call: python/install 2.0.1
    with:
      python-version: "3.13"

  - key: uv
    use: python
    run: pip install uv

  - key: sync
    use: [code, uv]
    run: uv sync
    filter:
      - pyproject.toml
      - uv.lock

  - key: integration
    use: sync
    env:
      ATTIO_API_TOKEN: ${{ vaults.sdk-python-attio.secrets.ATTIO_API_TOKEN }}
    run: uv run python tests/test_live_api.py
