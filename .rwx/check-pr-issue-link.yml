# Fails if the PR body has no `Closes #N` (or Refs #N / "No issue: reason"), so merge closes the
# issue and the claim is released. Rules: scripts/check-pr-issue-link.sh, AGENT-LABELS.md step 6.
# Other repos adopt it by copying this file with their own clone URL.
on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      pr-body: ""
      pr-author: ""
  github:
    pull_request:
      actions: [opened, reopened, synchronize, edited]
      init:
        commit-sha: ${{ event.git.sha }}
        pr-body: ${{ event.github.pull_request.pull_request.body }}
        pr-author: ${{ event.github.pull_request.pull_request.user.login }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/elviskahoro/sdk-python-attio.git
      ref: ${{ init.commit-sha }}

  - key: check
    use: code
    env:
      PR_BODY: ${{ init.pr-body }}
      PR_AUTHOR: ${{ init.pr-author }}
    run: scripts/check-pr-issue-link.sh
