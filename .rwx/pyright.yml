# On-demand pyright with a synced venv. Manual only: no github trigger, so it
# never runs on PRs or pushes and is not a required status.
#   rwx run .rwx/pyright.yml --wait
#   rwx run .rwx/pyright.yml --wait --init paths="attio_cli/main.py"
# `rwx run` layers the local working tree on the clone; HEAD must be pushed
# so `commit-sha` resolves.
on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      paths: ""

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/elviskahoro/sdk-python-attio.git
      ref: ${{ init.commit-sha }}

  - key: python
    call: python/install 2.0.1
    with:
      python-version: "3.13"

  - key: uv
    use: python
    run: pip install uv==0.11.26

  # The project installs editable from generated/src, so sources must be in
  # the workspace or `import attio` fails on a fresh sync.
  - key: sync
    use: [code, uv]
    run: uv sync
    filter:
      - pyproject.toml
      - uv.lock
      - README.md
      - generated/src
      - attio_cli

  # pyright comes from the dev group (pinned in pyproject.toml).
  - key: pyright
    use: [code, sync]
    cache: false
    env:
      CHECK_PATHS: ${{ init.paths }}
    run: |
      set -euo pipefail
      uv run pyright ${CHECK_PATHS}
