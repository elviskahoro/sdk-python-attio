# On-demand pyright with a synced venv. Manual only: no github trigger, so it
# never runs on PRs or pushes and is not a required status.
#   rwx run .rwx/pyright.yml --wait
#   rwx run .rwx/pyright.yml --wait --init paths="attio_cli/main.py"   # default: attio_cli ci, matching Trunk scope
# `rwx run` layers the local working tree on the clone; HEAD must be pushed
# so `commit-sha` resolves.
on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      paths: "attio_cli ci"

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/elviskahoro/sdk-python-attio.git
      ref: ${{ init.commit-sha }}

  - key: python
    call: python/install 2.0.1
    with:
      python-version: "3.13"

  - key: uv
    use: python
    run: pip install uv==0.11.26

  # The project installs editable from generated/src, so sources must be in
  # the workspace or `import attio` fails on a fresh sync.
  - key: sync
    use: [code, uv]
    run: uv sync
    filter:
      - pyproject.toml
      - uv.lock
      - README.md
      - generated/src
      - attio_cli

  # Dagger CLI, checksum-pinned; no `use:` so it content-caches across commits.
  # Keep the version in lockstep with `dagger-io` in pyproject.toml.
  - key: dagger-cli-install
    run: |
      set -euo pipefail
      v=0.21.10
      curl -fsSL "https://dl.dagger.io/dagger/releases/${v}/dagger_v${v}_linux_amd64.tar.gz" -o /tmp/dagger.tgz
      echo "f9ee083767dd12cdac583f9db3fedbebbbb3064f69152998be1f121d1a6cc103  /tmp/dagger.tgz" | sha256sum -c -
      mkdir -p "${HOME}/.local/bin"
      tar -xzf /tmp/dagger.tgz -C "${HOME}/.local/bin" dagger
      "${HOME}/.local/bin/dagger" version

  # Pre-pull the engine image so the Dagger task does not pay the cold pull.
  - key: dagger-engine-warm
    use: dagger-cli-install
    docker: preserve-data
    run: |
      set -euo pipefail
      for i in 1 2 3; do
        docker pull registry.dagger.io/engine:v0.21.10 && exit 0
        sleep 5
      done
      exit 1

  # pyright is pinned to the Trunk version (.trunk/trunk.yaml); the dev group pins an older one.
  - key: pyright
    use: [code, sync, dagger-cli-install, dagger-engine-warm]
    docker: true
    timeout: 30m
    cache: false
    env:
      CHECK_PATHS: ${{ init.paths }}
    run: ci/run.sh pyright
