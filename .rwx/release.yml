# One-command release of the version already committed on main:
#
#   rwx dispatch release --ref main --wait
#
# There is no bump step: version bumps come from the regeneration pipeline
# (spec-update-check.yml PRs, or `rwx dispatch regenerate` + a PR), which keeps
# gen.yaml, gen.lock, _version.py, pyproject.toml and uv.lock in lockstep. So
# this run never needs SPEAKEASY_API_KEY and never waits on an approver.
#
#   preflight -> read the version at the dispatched commit, check PyPI and the
#                remote vX.Y.Z tag. Both packages already live: stop (success).
#   tag       -> push an annotated vX.Y.Z on the dispatched commit, unless the
#                tag already exists (then the tagged commit is what ships).
#   publish   -> embeds publish.yml at that commit and tag: verify-version
#                (fails before any upload if the tag and committed version
#                disagree), test, build, twine upload --skip-existing.
#   verify    -> waits for both versions on PyPI, then smoke-tests
#                `uvx attio@X --version` and `uvx gtm-attio@X --version`.
#
# Re-runs are safe: an existing tag is reused, never moved, and twine skips
# files already on PyPI. main is never pushed to; the only ref pushed is the tag.
#
# GitHub write access: no PAT. The `tag` task gets a short-lived installation
# token for the private GitHub App `rwx-automation-elviskahoro`, which lives in
# the sdk-python-attio-release vault (locked to main, approvals off) and is
# installed on this repository only. RWX mints the token per run; nothing
# long-lived is stored. The PyPI tokens are read by the embedded publish.yml
# from sdk-python-attio-publish, so that vault stays single-purpose.
#
# Dispatch-only on purpose: a `cli` run starts from local HEAD, which could tag
# and publish an unmerged commit. (`rwx run --target preflight` adds a `cli`
# trigger automatically; drop it again before committing.)
#
# The pushed tag also triggers publish.yml's `v*` push run, which is held for a
# manual start. It is redundant after this run; cancel or ignore it.
on:
  dispatch:
    - key: release
      title: Release to PyPI
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

concurrency-pools:
  - id: elviskahoro/sdk-python-attio:release
    capacity: 1
    on-overflow: queue

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/elviskahoro/sdk-python-attio.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true

  - key: python
    call: python/install 2.0.1
    with:
      python-version: "3.13"

  - key: uv
    use: python
    run: pip install uv==0.11.26

  # Uncached: PyPI and the remote tags are external state that changes
  # between runs at the same commit.
  - key: preflight
    use: [code, python]
    cache: false
    env:
      COMMIT_SHA: ${{ init.commit-sha }}
    run: |
      set -euo pipefail
      version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      tag="v${version}"
      echo "Committed version at ${COMMIT_SHA}: ${version}"

      # Published means a wheel and an sdist for both packages, so a partial
      # upload from an earlier run still goes through publish (which skips the
      # files already there). Exit 1 = missing/incomplete, 2 = PyPI unreadable.
      status=0
      python3 ci/pypi_release_status.py "${version}" || status=$?
      case "${status}" in
        0) published=true ;;
        1) published=false ;;
        *) echo "Could not read PyPI; refusing to guess." >&2; exit 1 ;;
      esac

      # The peeled ^{} line gives an annotated tag's commit; a lightweight tag
      # only has the plain line.
      remote="$(git ls-remote --tags https://github.com/elviskahoro/sdk-python-attio.git "refs/tags/${tag}" "refs/tags/${tag}^{}")"
      tag_sha="$(printf '%s\n' "${remote}" | awk '$2 ~ /\^\{\}$/ {print $1}')"
      if [ -z "${tag_sha}" ]; then
        tag_sha="$(printf '%s\n' "${remote}" | awk 'NF {print $1; exit}')"
      fi

      if [ -n "${tag_sha}" ]; then
        tag_exists=true
        release_sha="${tag_sha}"
        echo "${tag} already exists at ${tag_sha}; releasing the tagged commit."
        if [ "${tag_sha}" != "${COMMIT_SHA}" ]; then
          echo "Note: ${tag} is not on the dispatched commit ${COMMIT_SHA}. The version on main was not bumped since that tag."
        fi
      else
        tag_exists=false
        release_sha="${COMMIT_SHA}"
        echo "${tag} does not exist yet; it will be created at ${COMMIT_SHA}."
      fi

      if [ "${published}" = true ]; then
        echo "attio and gtm-attio ${version} are both live on PyPI. Nothing to release."
        echo "Bump the version through the regeneration pipeline to release again."
      fi

      printf '%s' "${version}" > "$RWX_VALUES/version"
      printf '%s' "${tag}" > "$RWX_VALUES/tag"
      printf '%s' "${release_sha}" > "$RWX_VALUES/release-sha"
      printf '%s' "${tag_exists}" > "$RWX_VALUES/tag-exists"
      printf '%s' "${published}" > "$RWX_VALUES/published"

  # The only push in this run. An existing tag is never moved or re-pushed.
  - key: tag
    use: code
    if: ${{ tasks.preflight.values.published != 'true' && tasks.preflight.values.tag-exists != 'true' }}
    cache: false
    env:
      TAG: ${{ tasks.preflight.values.tag }}
      VERSION: ${{ tasks.preflight.values.version }}
      RELEASE_SHA: ${{ tasks.preflight.values.release-sha }}
      GITHUB_TOKEN: ${{ vaults.sdk-python-attio-release.github-apps.rwx-automation-elviskahoro.token }}
    run: |
      set -euo pipefail
      if [ -z "${GITHUB_TOKEN}" ]; then
        echo "No token from the rwx-automation-elviskahoro GitHub App. Check that it is in the sdk-python-attio-release vault and installed on this repository." >&2
        exit 1
      fi
      # The app's bot account, so the tagger shows as the app on GitHub.
      git config user.name "rwx-automation-elviskahoro[bot]"
      git config user.email "357120051+rwx-automation-elviskahoro[bot]@users.noreply.github.com"
      git tag -a "${TAG}" -m "Release ${VERSION}" "${RELEASE_SHA}"
      # The credential helper reads the token from the environment, so it
      # never appears in the remote URL, argv or the logs.
      git -c credential.helper= \
        -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${GITHUB_TOKEN}"; }; f' \
        push https://github.com/elviskahoro/sdk-python-attio.git "refs/tags/${TAG}:refs/tags/${TAG}"

  - key: publish
    call: ${{ run.dir }}/publish.yml
    if: ${{ tasks.preflight.values.published != 'true' }}
    after: ${{ tag.succeeded || tag.skipped }}
    init:
      commit-sha: ${{ tasks.preflight.values.release-sha }}
      tag: ${{ tasks.preflight.values.tag }}

  # Timeout covers the worst case: ~10m of PyPI polling plus ~2m of uvx
  # retries, with headroom so a slow but successful release never ends red.
  - key: verify
    use: [code, uv]
    if: ${{ tasks.preflight.values.published != 'true' }}
    after: [publish]
    cache: false
    timeout: 30m
    env:
      VERSION: ${{ tasks.preflight.values.version }}
    run: |
      set -euo pipefail
      # Wait for every file (wheel + sdist, both packages); ~10 minutes.
      for attempt in $(seq 1 60); do
        if python3 ci/pypi_release_status.py "${VERSION}"; then
          break
        fi
        if [ "${attempt}" -eq 60 ]; then
          echo "attio and gtm-attio ${VERSION} were not complete on PyPI within 10 minutes" >&2
          exit 1
        fi
        sleep 10
      done
      # The CDN can lag the JSON API, so retry the installs briefly.
      for cmd in attio gtm-attio; do
        for attempt in 1 2 3 4 5 6; do
          if uvx --refresh "${cmd}@${VERSION}" --version; then
            break
          fi
          if [ "${attempt}" -eq 6 ]; then
            echo "uvx ${cmd}@${VERSION} --version failed" >&2
            exit 1
          fi
          sleep 20
        done
      done
