        description: "A UUID or slug to identify the list."
        example: "33ebdbe9-e529-47c9-b894-0ba25e9c15c0"
      required: true
      name: "list"
      in: "path"
      x-speakeasy-name-override: "list_id"

  - target: "$.paths['/v2/threads'].get.parameters[?(@.name=='list')]"
    description: "Rename list parameter to list_id in GET /v2/threads"
    update:
      schema:
        type: string
        description: "Use this parameter to filter to threads on a specific entry. Must be passed with `entry_id`. Accepts either a slug or an ID."
        example: "33ebdbe9-e529-47c9-b894-0ba25e9c15c0"
      required: false
      name: "list"
      in: "query"
      x-speakeasy-name-override: "list_id"

  # Some endpoints currently return validation_type for 400s in addition to value_not_found.
  # Accept both to avoid ResponseValidationError when unmarshalling error responses.
  - target: "$.paths['/v2/{target}/{identifier}/attributes/{attribute}/options/{option}'].patch.responses['400'].content['application/json'].schema.properties.code.enum"
    description: "Allow validation_type code in PATCH /v2/{target}/{identifier}/attributes/{attribute}/options/{option}"
    update:
      - "validation_type"

  - target: "$.paths['/v2/{target}/{identifier}/attributes/{attribute}/statuses/{status}'].patch.responses['400'].content['application/json'].schema.properties.code.enum"
    description: "Allow validation_type code in PATCH /v2/{target}/{identifier}/attributes/{attribute}/statuses/{status}"
    update:
      - "validation_type"

  - target: "$.paths['/v2/objects/{object}/records'].post.responses['400'].content['application/json'].schema.properties.code.enum"
    description: "Allow validation_type code in POST /v2/objects/{object}/records"
    update:
