      x-speakeasy-name-override: "list_id"

  - target: "$.paths['/v2/lists/{list}/entries/{entry_id}/attributes/{attribute}/values'].get.parameters[?(@.name=='list')]"
    description: "Rename list parameter to list_id in GET /v2/lists/{list}/entries/{entry_id}/attributes/{attribute}/values"
    update:
      schema:
        type: string
        description: "A UUID or slug to identify the list."
        example: "33ebdbe9-e529-47c9-b894-0ba25e9c15c0"
      required: true
      name: "list"
      in: "path"
      x-speakeasy-name-override: "list_id"

  # Fix SCIM endpoints missing path parameters (upstream spec bug)
  - target: "$.paths['/scim/v2/Users/{user_id}'].get"
    description: "Add missing user_id path parameter to GET /scim/v2/Users/{user_id}"
    update:
      parameters:
        - schema:
            type: string
          required: true
          name: "user_id"
          in: "path"
          description: "The ID of the SCIM user to retrieve."

  - target: "$.paths['/scim/v2/Users/{user_id}'].patch"
    description: "Add missing user_id path parameter to PATCH /scim/v2/Users/{user_id}"
    update:
      parameters:
        - schema:
            type: string
          required: true
          name: "user_id"
          in: "path"
          description: "The ID of the SCIM user to update."

  - target: "$.paths['/scim/v2/Users/{user_id}'].put"
    description: "Add missing user_id path parameter to PUT /scim/v2/Users/{user_id}"
    update:
      parameters:
        - schema:
            type: string
          required: true
          name: "user_id"
          in: "path"
          description: "The ID of the SCIM user to replace."

  - target: "$.paths['/scim/v2/Users/{user_id}'].delete"
    description: "Add missing user_id path parameter to DELETE /scim/v2/Users/{user_id}"
    update:
      parameters:
        - schema:
