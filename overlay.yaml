  # Nullable GET query params are generated as three-state fields
  # (`OptionalNullable[T] = UNSET`): `UNSET` means omit the param, an explicitly
  # passed `None` means "send an empty value to filter for the null/empty case".
  # Speakeasy's query-param builder drops an explicitly-set `None` (collapsing it
  # with `UNSET`) unless `allowEmptyValue` is surfaced on the parameter so the
  # generator emits `allow_empty_value=["<param>"]` at the operation call site.
  # The runtime then sends `param=` (empty) for `None` and omits it for `UNSET`.
  # Speakeasy's Python generator does not read the standard OpenAPI
  # `allowEmptyValue` field; it reads the `x-speakeasy-allow-empty-value`
  # extension (`internal/extensions/extensions.go::ExtAllowEmptyValue`), which
  # `pkg/generate/parameters.go::handleQueryParameters` consults via
  # `HandleAllowEmptyQueryParameterValueExtension`. This action sets that
  # extension on the nullable `assignee` query param (whose OpenAPI description
  # explicitly documents "Pass an empty value or the string `null` to find
  # tasks with no assignee") so the fix survives `speakeasy run` regeneration.
  # The other nullable GET query params (`sent_after`, `sent_before`,
  # `ends_from`, `starts_before`, `created_after`) are timestamp filters whose
  # contract only accepts a timestamp string; an empty value is not a valid
  # filter for them, so `None` must keep the omit-the-param behavior and they
  # are intentionally NOT listed here.
  - target: "$.paths['/v2/tasks'].get.parameters[?(@.name=='assignee')]"
    description: "Allow empty value for nullable assignee query param in GET /v2/tasks so assignee=None filters for unassigned tasks"
    update:
      x-speakeasy-allow-empty-value: true
