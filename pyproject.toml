[project]
name = "attio"
version = "0.26.0"
description = "Attio API client library from elviskahoro"
authors = [{ name = "elviskahoro" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpcore >=1.0.9", "httpx >=0.28.1", "pydantic >=2.11.2"]
urls.homepage = "https://github.com/elviskahoro/attio-sdk-python"

[dependency-groups]
dev = [
  "dagger-io >=0.20.5",
  "mypy ==1.15.0",
  "pylint ==3.2.3",
  "pyright ==1.1.398",
  "pytest >=8.0.0",
  "pytest-asyncio >=0.24.0",
  "pyyaml >=6.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.mypy]
disable_error_code = "misc"
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "typing_inspect"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonpath"
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
