# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
#
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.6
      uri: https://github.com/trunk-io/plugins
    - id: oss-linter-trunk
      ref: v0.2026.04.14.00.00
      uri: https://github.com/elviskahoro/oss-linter-trunk
#
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: ruff
      commands:
        - name: format
          enabled: true
  enabled:
    - actionlint@1.7.11
    - bandit@1.9.4
    - checkov@3.2.521
    - markdown-link-check@3.14.2
    - markdownlint-cli2@0.22.0
    - osv-scanner@2.3.5
    - oxipng@10.1.0
    - pyright@1.1.409
    - ruff@0.15.11
    - semgrep@1.159.0
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - squawk@2.47.0
    - svgo@4.0.1
    - taplo@0.10.0
    - trivy@0.69.3
    - trufflehog@3.94.1
    - ty@0.0.26
    - yamlfmt@0.20.0
    - yamllint@1.38.0
  disabled:
    - ansible-lint
    - autopep8
    - biome
    - black
    - brakeman
    - buf-breaking
    - buf-format
    - buf-lint
    - buildifier
    - cfnlint
    - circleci
    - clang-format
    - clang-tidy
    - clippy
    - cmake-format
    - codespell
    - cspell
    - cue-fmt
    - dart
    - deno
    - detekt
    - detekt-explicit
    - detekt-gradle
    - djlint
    - dotenv-linter
    - dotnet-format
    - dustilock
    - eslint
    - flake8
    - git-diff-check
    - gitleaks
    - gofmt
    - gofumpt
    - goimports
    - gokart
    - golangci-lint
    - golangci-lint2
    - golines
    - google-java-format
    - graphql-schema-linter
    - hadolint
    - haml-lint
    - include-what-you-use
    - isort
    - ktlint
    - kube-linter
    - ls-lint
    - markdown-table-prettify
    - markdownlint
    - mypy
    - nancy
    - nbstripout
    - nixpkgs-fmt
    - opa
    - perlcritic
    - perltidy
    - php-cs-fixer
    - phpstan
    - pmd
    - pragma-once
    - pre-commit-hooks
    - prettier
    - prisma
    - psscriptanalyzer
    - pylint
    - regal
    - remark-lint
    - renovate
    - rome
    - rubocop
    - ruff-nbqa
    - rufo
    - rumdl
    - rustfmt
    - scalafmt
    - snyk
    - sort-package-json
    - sourcery
    - sql-formatter
    - sqlfluff
    - sqlfmt
    - standardrb
    - stringslint
    - stylelint
    - stylua
    - swiftformat
    - swiftlint
    - terraform
    - terragrunt
    - terrascan
    - tflint
    - tfsec
    - tofu
    - trufflehog-git
    - trunk-toolbox
    - txtpbfmt
    - vale
    - yapf
  ignore:
    - linters: [bandit]
      paths:
        - src/**
    - linters: [checkov]
      paths:
        - openapi/**
        - .speakeasy/out.openapi.yaml
    - linters: [markdown-link-check, markdownlint-cli2, trufflehog]
      paths:
        - docs/**
    - linters: [markdownlint-cli2]
      paths:
        - .agents/**
        - agents.md
    - linters: [pyright, ruff]
      paths:
        - src/**
        - tests/**
    - linters: [semgrep]
      paths:
        - "**/*.md"
        - src/**
        - openapi/api-*.json
        - openapi/api-*-overlay.json
    - linters: [semgrep]
      paths:
        - .speakeasy/gen.lock
  exported_configs:
    - plugin_id: oss-linter-trunk
      configs:
        - configs/.bandit
        - configs/.clang-format
        - configs/.clang-tidy
        - configs/.clangd
        - configs/.editorconfig
        - configs/.flake8
        - configs/.gitattributes
        - configs/.gitignore
        - configs/.hadolint.yaml
        - configs/.isort.cfg
        - configs/.markdownlint.yaml
        - configs/.mypy.ini
        - configs/.pr-labels.yaml
        - configs/.prettierrc.yaml
        - configs/.pylintrc
        - configs/.remarkrc.yaml
        - configs/.shellcheckrc
        - configs/.sqlfluff
        - configs/.stylelintrc.js
        - configs/.stylelintrc.yaml
        - configs/.yamlfmt
        - configs/.yamllint.yaml
        - configs/pyrightconfig.json
        - configs/ruff.toml
        - configs/rustfmt.toml
        - configs/svgo.config.js
actions:
  enabled:
    - git-lfs
    - trunk-announce
    - trunk-cache-prune
    - trunk-upgrade-available
  disabled:
    # Git-hook-triggered actions disabled so trunk releases core.hooksPath to
    # the machine-wide hook dispatcher (the Entire CLI hook chain); trunk's
    # hook installs collide with it and block commits/pushes.
    # trunk-check-pre-push is redundant with roborev + the merge queue's
    # required "Trunk Check / lint" status.
    - trunk-fmt-pre-commit
    - trunk-check-pre-push

merge:
  # These must be live GitHub status names posted on every PR targeting main.
  # Re-verify after any pipeline rename:
  #   gh pr checks <pr-number> --json name --jq '.[].name'
  #
  # Both entries are posted by GitHub Actions (.github/workflows/trunk-check.yml
  # and .github/workflows/tests.yml), which name check runs "<workflow name> /
  # <job name>". The same names post when the queue tests a PR: both workflows
  # trigger on the queue's draft test PRs (Draft PR mode, the queue default)
  # and on pushes to trunk-merge/** (Push-Triggered mode).
  #
  # Do NOT add path-filtered workflows here -- they do not report on every PR
  # and would deadlock the queue. Same for workflow_run-triggered workflows,
  # the tag-only "Publish to PyPI" workflow, and the scheduled
  # "Spec update check" (which also never runs on PRs at all).
  required_statuses:
    - "Trunk Check / lint"
    - "Tests / pytest"
