# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
#
# Adapted from the SanhedrinTech/gtm-sdk reference setup. Deviations from the
# reference config are commented inline; everything else mirrors it.
version: 0.1
cli:
  version: 1.25.0

# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins

    - id: oss-linter-trunk
      ref: v0.2026.04.14.00.00
      uri: https://github.com/elviskahoro/oss-linter-trunk-config

    - id: add-trailing-comma-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-add-trailing-comma

    - id: pyrefly-plugin
      ref: v0.2.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-pyrefly

    - id: tach-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-tach
# actionlint switched from upstream rhysd/actionlint to the actively maintained
# fork kjanat/actionlint (forked from upstream v1.7.12, independent releases from
# v1.8.0, CLI-compatible). Trunk's plugin catalog still pins the rhysd download
# URL, so override it here until the catalog carries the fork. Asset naming and
# the -format JSON output the plugin's `lint` command relies on are unchanged.
downloads:
  - name: actionlint
    downloads:
      - os:
          linux: linux
          macos: darwin
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_${os}_${cpu}.tar.gz
      - os: windows
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_windows_${cpu}.zip

# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    # The plugin's pyrefly command can't see the editable `attio` install (setuptools
    # finder, not a path .pth) and generated/ is outside Trunk's sandbox, so point
    # pyrefly at the generated SDK source explicitly.
    - name: pyrefly
      commands:
        - name: lint
          run: pyrefly check --python-interpreter-path ${workspace}/.venv/bin/python --search-path ${workspace} --site-package-path ${workspace}/generated/src --output-format=min-text --summary=none ${target}
    - name: ruff
      commands:
        - name: format
          enabled: true
        - name: lint
          enabled: true

  # Deviation from the reference config: Vale and its custom docs-markdown
  # file type are not enabled here. The reference scopes Vale to docs/** via
  # .vale.ini; this repo has no .vale.ini, and docs/ is speakeasy-generated
  # and already ignored for the markdown linters (see ignore: below).
  enabled:
    - actionlint@1.17.0
    - add-trailing-comma@4.0.0
    - bandit@1.9.4
    - buildifier@8.2.1
    - checkov@3.3.19
    - markdown-link-check@3.15.0
    - markdownlint-cli2@0.23.3
    - osv-scanner@2.6.0
    - oxipng@10.1.1
    - pinact@4.0.0
    - pyrefly@1.3.1
    - pyright@1.1.414
    - ruff@0.16.8
    - semgrep@1.177.0
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - squawk@2.65.0
    - svgo@4.1.0
    - tach@0.35.1
    - taplo@0.10.0
    - trivy@0.70.0
    - trufflehog@3.95.3
    - ty@0.0.35
    - yamlfmt@0.21.0
    - yamllint@1.38.0
  disabled:
    - ansible-lint
    - autopep8
    - biome
    - black
    - brakeman
    - buf-breaking
    - buf-format
    - buf-lint
    - cfnlint
    - circleci
    - clang-format
    - clang-tidy
    - clippy
    - cmake-format
    - codespell
    - cspell
    - cue-fmt
    - dart
    - deno
    - detekt
    - detekt-explicit
    - detekt-gradle
    - djlint
    - dotenv-linter
    - dotnet-format
    - dustilock
    - eslint
    - flake8
    - git-diff-check
    - gitleaks
    - gofmt
    - gofumpt
    - goimports
    - gokart
    - golangci-lint
    - golangci-lint2
    - golines
    - google-java-format
    - graphql-schema-linter
    - hadolint
    - haml-lint
    - include-what-you-use
    - isort
    - ktlint
    - kube-linter
    - ls-lint
    - markdown-table-prettify
    - markdownlint
    - mypy
    - nancy
    - nbstripout
    - nixpkgs-fmt
    - opa
    - perlcritic
    - perltidy
    - php-cs-fixer
    - phpstan
    - pmd
    - pragma-once
    - pre-commit-hooks
    - prettier
    - prisma
    - psscriptanalyzer
    - pylint
    - regal
    - remark-lint
    - renovate
    - rome
    - rubocop
    - ruff-nbqa
    - rufo
    - rumdl
    - rustfmt
    - scalafmt
    - snyk
    - sort-package-json
    - sourcery
    - sql-formatter
    - sqlfluff
    - sqlfmt
    - standardrb
    - stringslint
    - stylelint
    - stylua
    - swiftformat
    - swiftlint
    - terraform
    - terragrunt
    - terrascan
    - tflint
    - tfsec
    - tofu
    - trufflehog-git
    - trunk-toolbox
    - txtpbfmt
    - yapf
  ignore:
    - linters: [bandit]
      paths:
        - generated/**
    - linters: [checkov]
      paths:
        - openapi/**
        - .speakeasy/out.openapi.yaml
        - .github/workflows/pullfrog.yml
    - linters: [yamllint]
      paths:
        - .speakeasy/gen.yaml
    - linters: [markdown-link-check, markdownlint-cli2, trufflehog]
      paths:
        - generated/docs/**
    - linters: [markdownlint-cli2]
      paths:
        - .agents/**
        - agents.md
    # Deviation from the reference config: pyrefly and add-trailing-comma
    # (newly adopted from gtm-sdk) join pyright and ruff off generated/** and
    # tests/** -- generated/ is speakeasy-generated (regenerated wholesale, so
    # linting it just reds every regeneration PR) and tests/ already shares
    # that exclusion. Both ci/ and attio_cli/ keep full coverage.
    - linters: [pyright, pyrefly, ruff, add-trailing-comma]
      paths:
        - generated/**
        - tests/**
    - linters: [semgrep]
      paths:
        - "**/*.md"
        - generated/**
        - openapi/api-*.json
        # RWX run definitions, not GitHub Actions: the gha-* rules misfire on task-level env.
        - .rwx/**
        - openapi/api-*-overlay.json
    - linters: [semgrep]
      paths:
        - generated/.speakeasy/gen.lock
    - linters: [tach]
      paths:
        - generated/**
        - tests/**
  exported_configs:
    - plugin_id: oss-linter-trunk
      configs:
        - configs/.bandit
        - configs/.clang-format
        - configs/.clang-tidy
        - configs/.clangd
        - configs/.editorconfig
        - configs/.flake8
        - configs/.gitattributes
        - configs/.gitignore
        - configs/.hadolint.yaml
        - configs/.isort.cfg
        - configs/.markdownlint.yaml
        - configs/.mypy.ini
        - configs/.pr-labels.yaml
        - configs/.prettierrc.yaml
        - configs/.pylintrc
        - configs/.remarkrc.yaml
        - configs/.shellcheckrc
        - configs/.sqlfluff
        - configs/.stylelintrc.js
        - configs/.stylelintrc.yaml
        - configs/.yamlfmt
        - configs/.yamllint.yaml
        - configs/pyrightconfig.json
        - configs/ruff.toml
        - configs/rustfmt.toml
        - configs/svgo.config.js
actions:
  enabled:
    - trunk-cache-prune
    - trunk-upgrade-available
  disabled:
    # Git-hook-triggered actions disabled so trunk releases core.hooksPath to
    # the machine-wide hook dispatcher (the Entire CLI hook chain); trunk's
    # hook installs collide with it and block commits/pushes.
    # trunk-check-pre-push is redundant with roborev + the merge queue's
    # required "Lint with Trunk" status.
    - trunk-fmt-pre-commit
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push

merge:
  # These must be live GitHub status names posted on every PR targeting main.
  # Re-verify after any pipeline rename:
  #   gh pr checks <pr-number> --json name --jq '.[].name'
  #
  # "RWX: CI" is the single RWX status check from .rwx/ci.yml (pytest +
  # trunk lint tasks). RWX names it "RWX: <status-checks.name>"; both the
  # pull_request and push triggers set the same name so one required check
  # covers PRs and the merge queue's trunk-merge/** pushes. Re-verify with
  # the command above after the first run on a PR.
  #
  # "pullfrog-approval" is intentionally NOT required: the Pullfrog GitHub App
  # posts it asynchronously (or never, e.g. failed runs and bot-opened PRs), so
  # requiring it left PRs and the queue stuck on "Waiting for status to be
  # reported". It remains an advisory check. Keep it out of the GitHub ruleset
  # "main - required PR checks" too.
  #
  # Do NOT add path-filtered workflows here -- they do not report on every PR
  # and would deadlock the queue. Same for workflow_run-triggered workflows,
  # the tag-only .rwx/publish.yml, and the scheduled .rwx/spec-update-check.yml
  # (which never runs on PRs at all).
  required_statuses:
    - "RWX: CI"
